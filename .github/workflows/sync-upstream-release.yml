name: Sync upstream release automatically

on:
  push:
    branches:
      - release
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the maintained release branch
        uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 0

      - name: Merge the official release directly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/stats-organization/github-stats-extended.git
          git fetch upstream release
          git merge --no-edit upstream/release
          git push origin release

          git fetch origin master
          git switch --force-create master origin/master
          git merge --no-edit release
          git push origin master
